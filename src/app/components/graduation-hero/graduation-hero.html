<section class="hero" aria-labelledby="hero-title">
  <div class="hero__glow hero__glow--one" aria-hidden="true"></div>
  <div class="hero__glow hero__glow--two" aria-hidden="true"></div>

  <div class="hero__content">
    <p class="hero__eyebrow">{{ content.eyebrow }}</p>
    <div class="hero__ornament" aria-hidden="true">
      <span></span><i></i><span></span>
    </div>
    <h1 id="hero-title">{{ content.title }}</h1>
    <p class="hero__lead">{{ content.lead }}</p>
    <a class="hero__cta" href="#invitation">
      <span>{{ content.ctaLabel }}</span>
      <span aria-hidden="true">↓</span>
    </a>
  </div>

  <div class="hero__cap" aria-hidden="true">
    <span class="hero__cap-top"></span>
    <span class="hero__cap-base"></span>
    <span class="hero__tassel"></span>
  </div>
</section>
