<section id="invitation" class="invitation" aria-labelledby="invitation-title">
  <app-decorative-stars variant="paper" />
  <article class="invitation__card">
    <div class="invitation__ribbon" aria-hidden="true"><span>✦</span></div>
    <p class="invitation__eyebrow">{{ content.eyebrow }}</p>
    <p class="invitation__monogram" aria-hidden="true">MK</p>
    <h2 id="invitation-title">{{ content.title }}</h2>
    <p class="invitation__recipient">{{ content.recipient }}</p>
    <p class="invitation__degree">{{ content.degree }}</p>
    <p class="invitation__school">{{ content.school }}</p>
    <time datetime="2026-10-17">{{ content.dateLabel }}</time>
    <p class="invitation__note">{{ content.note }}</p>
  </article>
</section>
