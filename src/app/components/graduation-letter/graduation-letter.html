<section class="letter-section" aria-labelledby="letter-title">
  <article #letter class="letter" [class.letter--entered]="hasEntered()">
    <p class="letter__eyebrow">{{ content.eyebrow }}</p>
    <h2 id="letter-title">{{ content.title }}</h2>
    @for (paragraph of content.paragraphs; track paragraph; let index = $index) {
      <p [style.transition-delay]="index * 90 + 'ms'">{{ paragraph }}</p>
    }
    <footer>{{ content.signature }}</footer>
  </article>
</section>
