<main
  class="app-shell"
  [inert]="introVisible()"
  [attr.aria-hidden]="introVisible() ? 'true' : null"
>
  <div
    class="opening-story"
    appOpeningStory
    [enabled]="!introVisible()"
    [suspended]="lightboxIndex() !== null"
    [replayToken]="replayToken()"
  >
    <app-graduation-hero [content]="content.hero" (sectionRequested)="scrollToSection($event)" />
    <app-graduation-invitation [content]="content.invitation" />
  </div>
  <app-graduation-message [content]="content.message" />
  <app-interactive-photo-gallery
    [content]="content.gallery"
    [photos]="content.photos"
    [suspended]="lightboxIndex() !== null || introVisible()"
    (photoRequested)="openLightbox($event)"
  />
  <app-graduation-letter [content]="content.letter" />
  <app-closing-section [content]="content.closing" (replayRequested)="replayJourney()" />
</main>

@if (!introVisible()) {
  <app-section-navigator
    [activeSectionId]="activeSectionId()"
    (sectionSelected)="scrollToSection($event)"
  />
}

@if (introVisible()) {
  <app-gift-intro [content]="content.intro" (opened)="openGift()" />
}

<app-photo-lightbox
  [photos]="content.photos"
  [activeIndex]="lightboxIndex()"
  (activeIndexChange)="openLightbox($event)"
  (closed)="closeLightbox()"
  (scrollRestored)="onLightboxRestored()"
/>

<app-music-control #music [config]="content.music" [autoplayEnabled]="!introVisible()" />
